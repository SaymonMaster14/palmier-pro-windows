<!doctype html><html><head><meta charset="utf-8"><title>Palmier Pro Windows (community port)</title><style>:root{--bg:#14161a;--fg:#e8eaed;--mut:#9aa0a6;--acc:#4c8dff;--clip:#2f6fed;--line:#2a2e35;--panel:#0e1013;--btn:#23262c;--btn-line:#333842;--warn:#ffd60a;--danger:#ff453a;--wave:#7dd87d;--mark:#0af;--video:#000}body{background:var(--bg);color:var(--fg);font:14px system-ui;margin:0}header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}main{display:grid;grid-template-columns:250px 1fr 300px;height:calc(100vh - 47px)}section{padding:12px;border-right:1px solid var(--line);overflow:auto}button{background:var(--btn);color:var(--fg);border:1px solid var(--btn-line);border-radius:6px;padding:6px 10px;margin:2px;cursor:pointer}button:hover{border-color:var(--acc)}#tl{position:relative;height:150px;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:8px;user-select:none}.clip{position:absolute;height:26px;background:var(--clip);border-radius:4px;font-size:11px;line-height:26px;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:grab}.clip.sel{outline:2px solid var(--acc)}.clip.active{box-shadow:0 0 0 2px var(--warn) inset}.clip .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}.clip .hl{left:0}.clip .hr{right:0}.strip{height:12px;opacity:.85;vertical-align:bottom}.kd{position:absolute;top:2px;width:6px;height:6px;margin-left:-3px;background:var(--warn);transform:rotate(45deg)}.wv{position:absolute;left:0;right:0;bottom:0;height:14px;width:100%;opacity:.8}.mk{position:absolute;top:0;width:3px;height:10px;background:var(--mark)}.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);pointer-events:none}#log{white-space:pre-wrap;color:var(--mut);font-size:12px}</style></head><body>
<header><strong>Palmier Pro Windows</strong><span id="proj" style="color:var(--mut)"></span><button id="bSplit">Split @ playhead</button><button id="bUndo">Undo</button><button id="bRedo">Redo</button><button id="bSave">Save</button><button id="bNew">New</button><button id="bOpen">Open</button><button id="bImport">Import</button><button id="bExport">Export</button><div id="expq" style="font-size:12px"></div><button id="bLink">Link</button><button id="bUnlink">Unlink</button></header>
<main><section><h3>Media</h3><details><summary>Recent</summary><div id="rec"></div></details><input id="q" placeholder="search media" style="width:100%"><div id="media"></div><div id="hits" style="font-size:12px;color:var(--mut)"></div></section>
<section><h3>Preview</h3><video id="pv" controls style="width:100%;background:var(--video)"></video><select id="rate"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select><audio id="scrub" preload="auto"></audio><canvas id="meter" width="220" height="10" style="width:100%;height:10px;background:var(--panel)"></canvas><input id="seek" type="range" min="0" max="90" value="0" style="width:100%"><div id="tracks" style="font-size:12px"></div><div id="tl"></div><div id='expq' style='font-size:12px'></div><div style="color:var(--mut);font-size:12px">drag clip = move · edge handles = trim · click = select · Del = delete</div></section>
<section><h3>Inspector</h3><div id="insp" style="font-size:12px">select a clip</div><h3>Agent (local commands)</h3><input id="ag" placeholder="split here | marker x | ..." style="width:100%"><div id="aglog" style="font-size:12px"></div><h3>State</h3><div id="log"></div><h3>Settings</h3><div id="sets" style="font-size:12px"></div></section></main>
<script>
window.__errs = []; window.addEventListener("error", (e) => window.__errs.push(String((e.error && e.error.stack) || e.message)));

  for (const im of document.querySelectorAll("img[data-th]")) { window.palmier.thumb(im.dataset.th).then(p => { im.src = "file:///" + p.replace(/\\/g, "/"); }).catch(() => {}); }
  $("hits").textContent = q ? shown.length + " of " + S.media.length : "";

  paintStrips();
async function paintStrips() {
  for (const el of document.querySelectorAll('.clip')) {

    if (!c || (c.kind !== 'video' && c.kind !== 'image') || !c.assetId || el.querySelector('.strip')) continue;

    const n = Math.max(1, Math.min(3, Math.floor(c.durationFrames / 30)));
    for (let k = 0; k < n; k++) {
      const at = (c.sourceInFrame + ((k + 0.5) / n) * c.durationFrames * (c.speed || 1)) / fps;
      const im = document.createElement('img');
      im.className = 'strip';
      im.style.cssText = 'height:12px;opacity:.85;';
      el.appendChild(im);
      window.palmier.thumbAt(c.assetId, at).then(p => { im.src = 'file:///' + p.replace(/\\/g, '/'); }).catch(() => {});
    }
  }
}
  paintKeys();
  const vclip = SEQ.clips.find(c => c.kind === "video" && c.assetId);
  if (vclip) { const m = S.media.find(x => x.id === vclip.assetId); if (m && !$("pv").src) $("pv").src = "file:///" + m.path.replace(/\\/g, "/"); }
  await markActive();
}
async function renderInspector() {

  box.innerHTML += "<br>x <input id=iX size=5> y <input id=iY size=5> sc <input id=iS size=5> rot <input id=iR size=5> op <input id=iO size=5> vol <input id=iV size=5> fi <input id=iFi size=4> fo <input id=iFo size=4> tr <input id=iTr size=4> sp <input id=iSp size=4> cr <input id=iCr size=9 placeholder='l,t,r,b'> al <select id=iAl><option>left</option><option selected>center</option><option>right</option></select> bg <input type='checkbox' id=iBg> bl <select id=iBl><option>normal</option><option>screen</option><option>multiply</option><option>overlay</option></select> ff <select id=iFf><option>sans</option><option>serif</option><option>mono</option><option>arial</option><option>times</option><option>courier</option><option>verdana</option></select> B <input type='checkbox' id=iBo> I <input type='checkbox' id=iIt> <button id=iApply>Apply</button><br><button id=iKeyOp>key op @playhead</button><button id=iKeyVol>key vol @playhead</button><div id=iKeys style=font-size:11px></div>";
  const set = (id, v) => { document.querySelector(id).value = v; };

  const keyList = () => { const el = document.querySelector("#iKeys"); if (!el) return; const c2 = SEQ.clips.find(x => x.id === SEL); el.innerHTML = "op:" + (c2.opacityKeys || []).map(k => "<span>" + k.frame + "=" + k.value + " <a href=# data-k=op:" + k.frame + ">x</a></span>").join(" ") + " vol:" + (c2.volumeKeys || []).map(k => "<span>" + k.frame + "=" + k.value + " <a href=# data-k=vol:" + k.frame + ">x</a></span>").join(" "); el.querySelectorAll("a[data-k]").forEach(a => a.addEventListener("click", async (e) => { e.preventDefault(); const [tr, fr] = a.dataset.k.split(":"); await window.palmier.op("removeKeyframe", [SEQ.id, sel0(), tr, Number(fr)]); renderInspector.sel = ""; await refresh(); await renderInspector(); })); };
  keyList();
  const keyAt = async (tr) => { const num = (id) => Number(document.querySelector(id).value); await window.palmier.op("setKeyframe", [SEQ.id, sel0(), tr, { frame: FRAME, value: tr === "op" ? num("#iO") : num("#iV"), interpolation: "linear" }]); renderInspector.sel = ""; await refresh(); await renderInspector(); };

  document.querySelector("#iKeyVol").addEventListener("click", () => keyAt("volume"));
  document.querySelector("#iApply").addEventListener("click", async () => {
    const num = (id) => Number(document.querySelector(id).value);
    const r1 = await window.palmier.op("setTransform", [SEQ.id, c.id, { x: num("#iX"), y: num("#iY"), scaleX: num("#iS"), scaleY: num("#iS"), rotationDeg: num("#iR") }]);

    const r5 = await window.palmier.op("setTransition", [SEQ.id, c.id, Math.round(num("#iTr") * FPS)]);
    const r6 = await window.palmier.op("setSpeed", [SEQ.id, c.id, num("#iSp")]);
    const r8 = await window.palmier.op("setBlend", [SEQ.id, c.id, document.querySelector("#iBl").value]);
    const r9 = await window.palmier.op("setTextStyle", [SEQ.id, c.id, { textAlign: document.querySelector("#iAl").value, textBg: document.querySelector("#iBg").checked, fontFamily: document.querySelector("#iFf").value, fontBold: document.querySelector("#iBo").checked, fontItalic: document.querySelector("#iIt").checked }]).catch(function(e){ return { ok: false, error: String((e && e.message) || e) }; });

}
let scrubTimer = null;
async function scrubGrain() {
  const v = document.querySelector('#pv');
  if (!SEQ || (v && !v.paused)) return;
  try {
    const hit = await window.palmier.audioAt(SEQ.id, FRAME);
    const el = document.querySelector('#scrub');
    if (!hit) { el.pause(); return; }
    const url = 'file:///' + hit.path.replace(/\\/g, '/');
    if (el.src !== url) el.src = url;
    el.currentTime = Math.max(hit.atSec, 0);
    await el.play().catch(() => {});
    window.__scrubbed = (window.__scrubbed || 0) + 1;
    if (scrubTimer) clearTimeout(scrubTimer);
    scrubTimer = setTimeout(() => el.pause(), 150);
  } catch (e) {}
}
async function markActive() {
  if (!SEQ) return;
  const hit = await window.palmier.clipAt(SEQ.id, FRAME);
  document.querySelectorAll(".clip").forEach(el => {
    el.classList.toggle("active", !!hit && el.dataset.id === hit.id);
    el.classList.toggle("sel", SEL.has(el.dataset.id));
  });
  renderInspector();
  const ph = $("ph"); if (ph) ph.style.left = ($("seek").value / $("seek").max * 100) + "%";
  // Timeline->source mapping: preview shows the edit, not the raw file position.
  const v = $("pv");
  if (v && hit && hit.assetId) {
    const srcSec = (hit.sourceInFrame + (FRAME - hit.startFrame) * (hit.speed || 1)) / FPS;
    if (Math.abs(v.currentTime - srcSec) > 0.18) { try { v.currentTime = Math.max(srcSec, 0); } catch (e) {} }
  }
}
async function paintWaves() {
  for (const cv of document.querySelectorAll(".wv")) {
    try {
      const peaks = await window.palmier.waveform(cv.dataset.asset, 120);
      const w = cv.clientWidth || 100, h = 14;
      cv.width = w; cv.height = h;
      const g = cv.getContext("2d"); g.fillStyle = cssVar("--wave");
      const n = peaks.length;
      for (let i = 0; i < n; i++) { const bh = Math.max(1, peaks[i] * h); g.fillRect((i / n) * w, (h - bh) / 2, Math.max(1, w / n - 0.5), bh); }
    } catch (e) {}
  }
}
let meterState = null;
function hookMeter() {
  const v = document.querySelector("#pv"); if (!v || meterState) return;
  v.addEventListener("play", () => {
    try {
      if (!meterState) { const Ctx = window.AudioContext || window.webkitAudioContext; const ctx = new Ctx(); const src = ctx.createMediaElementSource(v); const an = ctx.createAnalyser(); an.fftSize = 256; src.connect(an); an.connect(ctx.destination); meterState = { ctx, an, buf: new Uint8Array(an.frequencyBinCount) }; window.__meterOn = true; }
      meterState.ctx.resume();
    } catch (e) {}
  });
  const cv = document.querySelector("#meter");
  const draw = () => {
    requestAnimationFrame(draw);
    const g = cv.getContext("2d"); g.clearRect(0, 0, cv.width, cv.height);
    if (!meterState) return;
    meterState.an.getByteTimeDomainData(meterState.buf);
    let peak = 0; for (const x of meterState.buf) { const d = Math.abs(x - 128) / 128; if (d > peak) peak = d; }
    g.fillStyle = peak > 0.9 ? cssVar("--danger") : cssVar("--acc");
    g.fillRect(0, 0, cv.width * Math.min(peak, 1), cv.height);
  };
  draw();
}
function paintKeys() {
  document.querySelectorAll(".clip").forEach(el => {
    const c = SEQ.clips.find(x => x.id === el.dataset.id); if (!c) return;
    const keys = [...(c.opacityKeys || []).map(k => ({ f: k.frame, k: "o" })), ...(c.volumeKeys || []).map(k => ({ f: k.frame, k: "v" }))];
    el.querySelectorAll(".kd").forEach(d => d.remove());
    for (const k of keys) {
      const d = document.createElement("div"); d.className = "kd"; d.title = k.k + "@" + k.f;
      d.style.left = ((k.f - c.startFrame) / c.durationFrames * 100) + "%";
      el.appendChild(d);
    }
  });
}
function paintTracks() {
  const box = document.querySelector("#tracks"); box.innerHTML = "";
  SEQ.tracks.forEach((tr) => {
    const d = document.createElement("div");
    const nm = document.createElement("span"); nm.textContent = tr.name + " "; box.appendChild(nm);
    [["M", "muted"], ["H", "hidden"], ["L", "locked"]].forEach(([lb, fl]) => {
      const b = document.createElement("button"); b.textContent = (tr[fl] ? "[" + lb + "]" : lb); b.style.borderColor = tr[fl] ? "var(--warn)" : "";
      b.addEventListener("click", async () => { const p = {}; p[fl] = !tr[fl]; await window.palmier.op("setTrackFlags", [SEQ.id, tr.id, p]); await refresh(); });
      box.appendChild(b);
    });
    box.appendChild(d); d.appendChild(nm);
  });
}
function bindClips() {
  document.querySelectorAll(".clip").forEach(el => {
    el.addEventListener("dblclick", async (e) => { e.stopPropagation(); const c = SEQ.clips.find(x => x.id === el.dataset.id); if (!c) return; const rel = Math.min(Math.max(FRAME - c.startFrame, 0), c.durationFrames); const tr = c.kind === "audio" ? "volume" : "opacity"; const val = tr === "volume" ? c.volume : c.opacity; const r = await window.palmier.op("setKeyframe", [SEQ.id, c.id, tr, { frame: c.startFrame + rel, value: val, interpolation: "linear" }]); log("key: " + JSON.stringify(r)); renderInspector.sel = ""; await refresh(); await renderInspector(); });
    el.addEventListener("mousedown", (e) => {

      e.preventDefault();
      if (e.ctrlKey || e.metaKey) { const id = el.dataset.id; if (SEL.has(id)) SEL.delete(id); else SEL.add(id); } else SEL = new Set([el.dataset.id]); markActive();
      const tl = $("tl").getBoundingClientRect();
      const x0 = e.clientX;
      const edge = e.target.dataset && e.target.dataset.e;
      const move = (ev) => {};
      const up = async (ev) => {
        document.removeEventListener("mouseup", up);
        const dx = ev.clientX - x0;
        const df = Math.round(dx / tl.width * DUR());
        if (df === 0) return;
        const c = SEQ.clips.find(x => x.id === el.dataset.id);
        let r;
        if (edge === "l") r = await window.palmier.op("trimStart", [SEQ.id, sel0(), df]);
        else if (edge === "r") r = await window.palmier.op("trimEnd", [SEQ.id, sel0(), c.durationFrames + df]);
        else if (ev.altKey) { r = await window.palmier.op("overwritePlace", [SEQ.id, c.trackId, { kind: c.kind, assetId: c.assetId, startFrame: Math.max(c.startFrame + df, 0), durationFrames: c.durationFrames, name: c.name }]); }
        else { const ids = [...SEL].filter((id) => SEQ.clips.some((x) => x.id === id)); const all = ids.length > 1 && ids.includes(el.dataset.id) ? ids : [el.dataset.id]; const moves = []; for (const id of all) { const cc = SEQ.clips.find((x) => x.id === id); moves.push({ clipId: id, toTrackId: cc.trackId, toStart: 0 }); } for (const m of moves) { const cc = SEQ.clips.find((x) => x.id === m.clipId); const raw = Math.max(cc.startFrame + df, 0); const sn = await window.palmier.snapMove(SEQ.id, m.clipId, raw, FRAME); m.toStart = sn; } r = all.length > 1 ? await window.palmier.op("moveClips", [SEQ.id, moves]) : await window.palmier.op("moveClip", [SEQ.id, all[0], SEQ.clips.find((x) => x.id === all[0]).trackId, moves[0].toStart]); }
        log(((edge === "l") ? "trimStart" : (edge === "r") ? "trimEnd" : "move") + ": " + JSON.stringify(r));
        await refresh();
      };

    });
  });
}
$("seek").addEventListener("input", async (e) => { FRAME = Number(e.target.value); await markActive(); await scrubGrain(); });
$("pv").addEventListener("timeupdate", async (e) => {
  if (document.activeElement === $("seek")) return;

  $("seek").value = FRAME; await markActive();

  log("split: " + JSON.stringify(r)); await refresh();

$("bUndo").addEventListener("click", async () => { const r = await window.palmier.op("undo", []); log("undo: " + JSON.stringify(r)); await refresh(); });
$("bRedo").addEventListener("click", async () => { const r = await window.palmier.op("redo", []); log("redo: " + JSON.stringify(r)); await refresh(); });

  if ((e.key === "m" || e.key === "M") && SEQ && document.activeElement.tagName !== "INPUT") { const r = await window.palmier.op("addMarker", [SEQ.id, { name: "M" + FRAME, startFrame: FRAME }]); log("marker: " + JSON.stringify(r)); await refresh(); return; }

window.palmier.onStoreChanged(() => refresh());

document.querySelector("#ag").addEventListener("keydown", async (e) => { if (e.key !== "Enter") return; const q = e.target.value; e.target.value = ""; const r = await window.palmier.agentRun(q, { sequenceId: SEQ.id, playheadFrame: FRAME, selectedClipId: sel0() }); const al = document.querySelector("#aglog"); al.textContent = "> " + q + "\\n" + r + "\\n" + al.textContent.slice(0, 1500); await refresh(); });
document.querySelector("#bNew").addEventListener("click", async () => { await window.palmier.newProject(); SEL = new Set(); await refresh(); });
document.querySelector("#bLink").addEventListener("click", async () => { const ids = [...SEL]; if (ids.length < 2) { log("link: select 2+ clips"); return; } const r = await window.palmier.op("linkClips", [SEQ.id, ids]); log("link: " + JSON.stringify(r)); await refresh(); });
document.querySelector("#bUnlink").addEventListener("click", async () => { const r = await window.palmier.op("unlinkClips", [SEQ.id, [...SEL]]); log("unlink: " + JSON.stringify(r)); await refresh(); });
document.querySelector("#bOpen").addEventListener("click", async () => { try { const r = await window.palmier.openProject(); if (r.opened) await refresh(); log("opened: " + JSON.stringify(r)); } catch (e) { log("open: " + e.message); } });
async function paintRecents() { try { const rs = await window.palmier.listRecents(); const box = document.querySelector("#rec"); box.innerHTML = ""; rs.forEach((rp) => { const d = document.createElement("div"); const a = document.createElement("a"); a.href = "#"; a.textContent = rp; a.addEventListener("click", async (ev) => { ev.preventDefault(); await window.palmier.openProject(rp); await refresh(); }); d.appendChild(a); box.appendChild(d); }); if (!rs.length) box.innerHTML = "<small>none</small>"; } catch (e) {} }
paintRecents();
async function paintSettings() { try { const s = await window.palmier.getSettings(); const box = document.querySelector("#sets"); box.innerHTML = "";
  const row = (k, v) => { const d = document.createElement("div"); d.textContent = k + ": " + v; box.appendChild(d); };
  row("ffmpeg", s.deps.ffmpeg); row("ffprobe", s.deps.ffprobe);
  const lb = document.createElement("label"); lb.textContent = "mcp port "; const inp = document.createElement("input"); inp.size = 6; inp.value = s.mcpPort; const btn = document.createElement("button"); btn.textContent = "save";
  btn.addEventListener("click", async () => { try { const r = await window.palmier.setSettings({ mcpPort: Number(inp.value) }); log("settings: " + JSON.stringify(r)); } catch (e) { log("settings FAIL: " + e.message); } });
  lb.appendChild(inp); box.appendChild(lb); box.appendChild(btn);
} catch (e) {} }
paintSettings();
hookMeter();
document.querySelector("#q").addEventListener("input", () => refresh());
document.querySelector("#bImport").addEventListener("click", async () => { try { const r = await window.palmier.importMedia(); log("import: " + JSON.stringify(r)); await refresh(); } catch (e) { log("import FAIL (use IPC): " + e.message); } });
document.querySelector("#bExport").addEventListener("click", async () => { try { const j = await window.palmier.exportStart(); log("queued: " + JSON.stringify(j)); } catch (e) { log("export FAIL: " + e.message); } });
$("bSave").addEventListener("click", async () => { try { const r = await window.palmier.saveProject(); log("saved: " + JSON.stringify(r)); } catch (e) { log("save FAIL: " + e.message); } });
refresh();
</script></body></html>
